services:
  postgres:
    image: postgres:16-alpine
    container_name: eduai-postgres
    environment:
      POSTGRES_DB: eduai
      POSTGRES_USER: eduai
      POSTGRES_PASSWORD: eduai_dev_password
    ports:
      - "5432:5432"
    volumes:
      - eduai_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eduai -d eduai"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  eduai_postgres_data:
