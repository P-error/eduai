[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "eduai-ml"
version = "0.1.0"
description = "Research ML contracts and utilities for EduAI pedagogy policy artifacts."
requires-python = ">=3.10"
dependencies = [
  "jsonschema>=4.21.0"
]

[project.optional-dependencies]
test = [
  "pytest>=8.0.0"
]
train = [
  "catboost>=1.2.7",
  "scikit-learn>=1.4.0"
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
